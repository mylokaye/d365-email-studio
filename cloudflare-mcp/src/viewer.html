<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email preview</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 20px; color: CanvasText; background: Canvas; }
  main { max-width: 900px; margin: auto; }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: color-mix(in srgb, CanvasText 70%, Canvas); }
  .preview { height: 50vh; min-height: 280px; overflow: hidden; border: 1px solid #8b8b8b; border-radius: 12px; background: white; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
  .controls { display: flex; gap: 12px; margin-top: 16px; }
  button { flex: 1; min-height: 54px; padding: 12px 18px; border: 0; border-radius: 9px; background: #1266d6; color: white; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
  button:hover { background: #0b55b9; }
  button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { min-height: 1.5em; margin-top: 12px; }
  @media (max-width: 540px) { body { padding: 14px; } .controls { flex-direction: column; } }
</style>
<main>
  <h1 id="title">Email preview</h1>
  <p>Preview area is half the available screen height. Scroll inside it to inspect the whole email. Remote images are blocked in this preview.</p>
  <div class="preview"><iframe id="preview" title="Completed email preview" sandbox="" referrerpolicy="no-referrer"></iframe></div>
  <div class="controls">
    <button id="copy" type="button" disabled>Copy HTML</button>
    <button id="download" type="button" disabled>Download HTML</button>
  </div>
  <p id="status" role="status" aria-live="polite">Preparing email preview…</p>
</main>
<!-- VIEWER_SCRIPT -->
</html>
